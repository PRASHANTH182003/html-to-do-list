<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To Do List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 0.9rem;
      opacity: 0.85;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #f8f9ff;
      padding: 15px;
      border-bottom: 1px solid #e8ecff;
    }

    .stat-box {
      text-align: center;
    }

    .stat-box span {
      display: block;
    }

    .stat-box .count {
      font-size: 1.6rem;
      font-weight: 700;
      color: #667eea;
    }

    .stat-box .label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-area {
      padding: 25px;
      border-bottom: 1px solid #e8ecff;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-row input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e4ff;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-row input[type="text"]:focus {
      border-color: #667eea;
    }

    .input-row select {
      padding: 12px 10px;
      border: 2px solid #e0e4ff;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      background: white;
      color: #444;
      cursor: pointer;
      transition: border-color 0.3s;
    }

    .input-row select:focus {
      border-color: #667eea;
    }

    .btn-add {
      padding: 12px 22px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.1s;
    }

    .btn-add:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    .date-input {
      width: 100%;
      padding: 10px 16px;
      border: 2px solid #e0e4ff;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      color: #444;
      transition: border-color 0.3s;
    }

    .date-input:focus {
      border-color: #667eea;
    }

    .filters {
      display: flex;
      gap: 8px;
      padding: 15px 25px;
      background: #f8f9ff;
      border-bottom: 1px solid #e8ecff;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 16px;
      border: 2px solid #e0e4ff;
      border-radius: 20px;
      background: white;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      color: #555;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .task-list {
      padding: 20px 25px;
      min-height: 200px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f8f9ff;
      border: 1px solid #e8ecff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      transition: all 0.3s;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover {
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.15);
    }

    .task-item.completed {
      opacity: 0.6;
      background: #f0f0f0;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
      flex-shrink: 0;
    }

    .task-content {
      flex: 1;
    }

    .task-text {
      font-size: 0.95rem;
      color: #333;
      font-weight: 500;
    }

    .task-meta {
      display: flex;
      gap: 10px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .priority-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .priority-high   { background: #ffe0e0; color: #e53935; }
    .priority-medium { background: #fff3cd; color: #f57c00; }
    .priority-low    { background: #e8f5e9; color: #2e7d32; }

    .due-date {
      font-size: 0.75rem;
      color: #888;
    }

    .due-date.overdue {
      color: #e53935;
      font-weight: 600;
    }

    .task-actions {
      display: flex;
      gap: 6px;
    }

    .btn-edit,
    .btn-delete {
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-edit {
      background: #e8f0ff;
      color: #667eea;
    }

    .btn-delete {
      background: #ffe8e8;
      color: #e53935;
    }

    .btn-edit:hover,
    .btn-delete:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #bbb;
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .empty-state p {
      font-size: 0.95rem;
    }

    .footer-actions {
      padding: 15px 25px;
      border-top: 1px solid #e8ecff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9ff;
    }

    .btn-clear {
      padding: 8px 18px;
      background: #ffe8e8;
      color: #e53935;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-clear:hover { opacity: 0.8; }

    .footer-note {
      font-size: 0.78rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <h1>📝 To Do List</h1>
      <p>Stay organised. Stay productive.</p>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-box">
        <span class="count" id="totalCount">0</span>
        <span class="label">Total</span>
      </div>
      <div class="stat-box">
        <span class="count" id="pendingCount">0</span>
        <span class="label">Pending</span>
      </div>
      <div class="stat-box">
        <span class="count" id="completedCount">0</span>
        <span class="label">Completed</span>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Enter a new task..." />
        <select id="prioritySelect">
          <option value="low">🟢 Low</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>
        <button class="btn-add" onclick="addTask()">＋</button>
      </div>
      <input type="date" id="dueDateInput" class="date-input" />
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
      <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
      <button class="filter-btn" onclick="setFilter('high', this)">🔴 High</button>
      <button class="filter-btn" onclick="setFilter('medium', this)">🟡 Medium</button>
      <button class="filter-btn" onclick="setFilter('low', this)">🟢 Low</button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="taskList">
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>No tasks yet. Add one above!</p>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="footer-actions">
      <button class="btn-clear" onclick="clearCompleted()">Clear Completed</button>
      <span class="footer-note">Tasks saved locally in browser</span>
    </div>

  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('todoTasks')) || [];
    let currentFilter = 'all';

    function saveTasks() {
      localStorage.setItem('todoTasks', JSON.stringify(tasks));
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const priority = document.getElementById('prioritySelect').value;
      const dueDate = document.getElementById('dueDateInput').value;
      const text = input.value.trim();

      if (!text) {
        input.focus();
        input.style.borderColor = '#e53935';
        setTimeout(() => input.style.borderColor = '#e0e4ff', 1500);
        return;
      }

      const task = {
        id: generateId(),
        text: text,
        priority: priority,
        dueDate: dueDate,
        completed: false,
        createdAt: new Date().toISOString()
      };

      tasks.unshift(task);
      saveTasks();
      renderTasks();

      input.value = '';
      document.getElementById('dueDateInput').value = '';
      input.focus();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      const newText = prompt('Edit task:', task.text);
      if (newText && newText.trim()) {
        task.text = newText.trim();
        saveTasks();
        renderTasks();
      }
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      renderTasks();
    }

    function isOverdue(dueDate) {
      if (!dueDate) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return new Date(dueDate) < today;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function renderTasks() {
      const list = document.getElementById('taskList');

      let filtered = tasks;
      if (currentFilter === 'pending')   filtered = tasks.filter(t => !t.completed);
      if (currentFilter === 'completed') filtered = tasks.filter(t => t.completed);
      if (currentFilter === 'high')      filtered = tasks.filter(t => t.priority === 'high');
      if (currentFilter === 'medium')    filtered = tasks.filter(t => t.priority === 'medium');
      if (currentFilter === 'low')       filtered = tasks.filter(t => t.priority === 'low');

      // Update stats
      document.getElementById('totalCount').textContent = tasks.length;
      document.getElementById('pendingCount').textContent = tasks.filter(t => !t.completed).length;
      document.getElementById('completedCount').textContent = tasks.filter(t => t.completed).length;

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">📋</div>
            <p>No tasks found.</p>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(task => {
        const overdue = !task.completed && isOverdue(task.dueDate);
        return `
          <div class="task-item ${task.completed ? 'completed' : ''}">
            <input type="checkbox" class="task-checkbox"
              ${task.completed ? 'checked' : ''}
              onchange="toggleTask('${task.id}')" />
            <div class="task-content">
              <div class="task-text">${escapeHtml(task.text)}</div>
              <div class="task-meta">
                <span class="priority-badge priority-${task.priority}">
                  ${task.priority}
                </span>
                ${task.dueDate ? `<span class="due-date ${overdue ? 'overdue' : ''}">
                  📅 ${formatDate(task.dueDate)}${overdue ? ' (Overdue)' : ''}
                </span>` : ''}
              </div>
            </div>
            <div class="task-actions">
              <button class="btn-edit" onclick="editTask('${task.id}')">✏️</button>
              <button class="btn-delete" onclick="deleteTask('${task.id}')">🗑️</button>
            </div>
          </div>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(text));
      return div.innerHTML;
    }

    // Allow pressing Enter to add task
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addTask();
    });

    // Initial render
    renderTasks();
  </script>
</body>
</html>
